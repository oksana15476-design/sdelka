name: Node, pnpm и кэш
description: >-
  Одинаковая подготовка для всех работ: Node 22, pnpm из поля packageManager,
  кэш хранилища pnpm и установка по замку зависимостей.

runs:
  using: composite
  steps:
    # Версия pnpm не названа здесь ни разу: action читает её из поля
    # `packageManager` корневого package.json. Написать «9.12.0» вторым местом
    # значит завести расхождение, которое проявится через полгода как
    # «локально ставится одно, в проверке другое».
    - uses: pnpm/action-setup@v4

    # setup-node идёт ПОСЛЕ pnpm: `cache: pnpm` спрашивает у самого pnpm, где
    # его хранилище, и без установленного pnpm шаг падает.
    - uses: actions/setup-node@v4
      with:
        # Поле engines.node в корневом package.json — «>=22». Здесь стоит
        # ровно та же мажорная версия; расходиться им нельзя.
        node-version: '22'
        cache: pnpm

    # `--frozen-lockfile` — не удобство, а условие воспроизводимости: установка,
    # которой позволено дописать замок, проверяет уже не то дерево зависимостей,
    # которое уедет в развёртывание.
    - run: pnpm install --frozen-lockfile
      shell: bash
